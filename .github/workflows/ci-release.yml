name: Cross-Platform Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain (min SRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --tests -- -D warnings
      - name: clap deprecated checks
        run: cargo check --features clap/deprecated

  test-min:
    name: Test (min SRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain (min SRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_SRV }}
      - name: cargo test
        run: cargo test --locked
  build:
    needs: 
      - style
      - test-min
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-static
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-aarch64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Run tests
        if: "!matrix.use_cross"
        run: cargo test --target ${{ matrix.target }}

      - name: Package archive (.tar.gz)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.target }}/release"
          BIN_NAME="${{ github.event.repository.name }}${{ endsWith(matrix.target, 'windows-msvc') && '.exe' || '' }}"
          VERSION="${{ github.ref_name }}"
          ARCHIVE_NAME="${{ github.event.repository.name }}-${VERSION}-${{ matrix.target }}.tar.gz"
          STAGING_ROOT="artifacts"
          STAGING_DIR="${STAGING_ROOT}/${{ github.event.repository.name }}-${VERSION}-${{ matrix.target }}"

          mkdir -p "${STAGING_DIR}"
          cp "${BIN_DIR}/${BIN_NAME}" "${STAGING_DIR}/"
          if [[ "${{ matrix.target }}" != *"windows-msvc"* ]]; then
            chmod +x "${STAGING_DIR}/${BIN_NAME}"
          fi

          for f in README.md CHANGELOG.md LICENSE; do
            [[ -f "$f" ]] && cp "$f" "${STAGING_DIR}/"
          done

          mkdir -p "${STAGING_ROOT}"
          tar -C "${STAGING_ROOT}" -czf "${STAGING_ROOT}/${ARCHIVE_NAME}" "$(basename "${STAGING_DIR}")"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
